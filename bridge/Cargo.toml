[package]
name = "sathunter-bridge"
version = "1.0.0"
edition = "2021"
description = "Lets SatHunter Web SDR reach an RTL-SDR and an ESP32-S3 SDR from any browser (Firefox too) through a local WebSocket"
license = "GPL-3.0-or-later"
repository = "https://github.com/z2labs/SatHunter-WEB-SDR"

[dependencies]
futures-util = "0.3.34"
nusb = "0.1.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "signal"] }
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
